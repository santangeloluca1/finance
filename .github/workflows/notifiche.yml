# Controllo degli avvisi ogni 15 minuti in orario di borsa (il piano Hobby di
# Vercel permette i cron solo una volta al giorno). Minuti "dispari" (4, 19, 34,
# 49): GitHub salta molte esecuzioni pianificate allo scoccare del quarto d'ora.
# Il workflow si autentica con il token OIDC di GitHub: nessun secret da configurare.
name: Notifiche

on:
  schedule:
    - cron: "4,19,34,49 6-20 * * 1-5"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      APP_URL: ${{ vars.APP_URL || 'https://basis-project.vercel.app' }}
    steps:
      - name: Controlla gli avvisi
        run: |
          TOKEN=$(curl -fsS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=basis-notify" | jq -r .value)
          curl -fsS --max-time 90 -H "Authorization: Bearer $TOKEN" "$APP_URL/api/notify/run?slot=github"
