# Controllo degli avvisi ogni 15 minuti in orario di borsa (il piano Hobby di
# Vercel permette i cron solo una volta al giorno). Servono due secret del
# repository: APP_URL (es. https://basis.vercel.app) e CRON_SECRET (lo stesso
# valore impostato su Vercel). Senza secret il job non fa nulla.
name: Notifiche

on:
  schedule:
    - cron: "*/15 7-20 * * 1-5"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Controlla gli avvisi
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL o CRON_SECRET non configurati: salto."
            exit 0
          fi
          curl -fsS --max-time 90 -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/notify/run?slot=github"
