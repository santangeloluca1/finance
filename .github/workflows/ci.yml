# Controlli a ogni pull request e a ogni push su main: tipi, test e build.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # .npmrc ha legacy-peer-deps=true: npm ci lo legge da solo.
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build
        run: npm run build
        env:
          # Better Auth crea il suo contesto già all'import di src/lib/auth.ts e, con
          # NODE_ENV=production, rifiuta il secret di default: un valore finto basta per la
          # build (nessuna richiesta viene servita). Senza DATABASE_URL le API rispondono 503.
          BETTER_AUTH_SECRET: ci-build-placeholder-7f3c9a1e5b2d8046c1e9f7a3b5d2c8e0
          NEXT_TELEMETRY_DISABLED: "1"
